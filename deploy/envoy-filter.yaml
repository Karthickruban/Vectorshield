# Envoy HTTP/gRPC Filter Definition for Vector-Shield In-Flight Screening
static_resources:
  listeners:
  - name: vectorshield_ingress
    address:
      socket_address: { address: 0.0.0.0, port_value: 15001 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: vectorshield_interceptor
          codec_type: AUTO
          route_config:
            name: local_route
            virtual_hosts:
            - name: local_service
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: upstream_vector_cluster, timeout: 0.25s }
          http_filters:
          - name: envoy.filters.http.ext_authz
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
              grpc_service:
                envoy_grpc:
                  cluster_name: vectorshield_scoring_daemon
              transport_api_version: V3
              with_request_body:
                max_request_bytes: 65536
                pack_as_bytes: true
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: vectorshield_scoring_daemon
    type: STATIC
    connect_timeout: 0.01s
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: vectorshield_scoring_daemon
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              pipe:
                path: /tmp/vectorshield.sock # Unix Domain Socket for <500us IPC
